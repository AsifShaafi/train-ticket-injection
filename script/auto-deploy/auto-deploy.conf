# Train-ticket auto-deploy configuration (sourced by auto-deploy.sh).
# Edit, then: sudo systemctl restart train-ticket-auto-deploy.timer
# (the next timer tick picks up changes; no restart strictly required).

# Absolute path to the git checkout that gets deployed.
REPO_DIR=/home/asifimtiaz_shaafi1/dev/train-ticket-injection

# Branch + remote to track. A new commit here triggers a rebuild/redeploy.
REMOTE_NAME=origin
BRANCH=injection

# Args passed through to `make ... DeployArgs=`.
DEPLOY_ARGS=--with-tracing --with-monitoring

# Kubernetes namespace passed through to `make ... Namespace=`.
NAMESPACE=default

# 1 = run `minikube start` automatically if it is not running.
AUTO_START_MINIKUBE=1

# 1 = run `make reset-deploy` before deploying so helm re-installs cleanly and
#     pods are recreated against the freshly built images.
# WARNING: this wipes cluster + DB state on every update.
RESET_BEFORE_DEPLOY=1
